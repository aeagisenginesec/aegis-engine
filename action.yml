name: "Aegis IaC Scan"
description: "Scan Terraform, CloudFormation, Kubernetes manifests, Dockerfiles, Compose, ARM and Bicep for misconfigurations with Aegis — deterministic findings, SARIF output, severity gating and baselines."
author: "Reda Elmabrouki"

branding:
  icon: "shield"
  color: "purple"

inputs:
  path:
    description: "Directory to scan, relative to the workspace."
    required: false
    default: "."
  version:
    description: "Aegis release version to run (a release tag of aeagisenginesec/aegis-engine). The binary is downloaded from that release and verified against its published SHA256SUMS."
    required: false
    default: "v2.2.0"
  fail-on:
    description: "Lowest severity that fails the job: critical, high, medium, low — or none for report-only."
    required: false
    default: "high"
  baseline:
    description: "Path to a baseline file generated by a previous scan (--baseline-out). Baselined findings are suppressed and never fail the gate."
    required: false
    default: ""
  upload-sarif:
    description: "Upload the SARIF report to GitHub code scanning (requires the security-events: write permission on the calling job)."
    required: false
    default: "true"
  args:
    description: "Extra arguments passed verbatim to `aegis scan`."
    required: false
    default: ""

outputs:
  sarif-file:
    description: "Absolute path of the SARIF report produced by the scan."
    value: ${{ steps.scan.outputs.sarif-file }}
  findings:
    description: "Total number of findings in the SARIF report (after baseline suppression)."
    value: ${{ steps.scan.outputs.findings }}

runs:
  using: "composite"
  steps:
    - name: Resolve the Aegis binary for this runner
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        case "${{ runner.os }}" in
          Linux)   os="linux" ;;
          macOS)   os="darwin" ;;
          Windows) os="windows" ;;
          *) echo "::error::Unsupported runner OS: ${{ runner.os }}"; exit 1 ;;
        esac
        case "${{ runner.arch }}" in
          X64)   arch="amd64" ;;
          ARM64) arch="arm64" ;;
          *) echo "::error::Unsupported runner architecture: ${{ runner.arch }}"; exit 1 ;;
        esac
        ext=""
        if [ "$os" = "windows" ]; then ext=".exe"; fi
        echo "asset=aegis-${os}-${arch}${ext}" >> "$GITHUB_OUTPUT"

    - name: Download Aegis (checksum-verified)
      shell: bash
      env:
        AEGIS_ASSET: ${{ steps.resolve.outputs.asset }}
        AEGIS_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        base="https://github.com/aeagisenginesec/aegis-engine/releases/download/${AEGIS_VERSION}"
        dest="$RUNNER_TEMP/aegis-bin"
        mkdir -p "$dest"
        curl -sSfL --proto '=https' -o "$dest/$AEGIS_ASSET" "$base/$AEGIS_ASSET"
        curl -sSfL --proto '=https' -o "$dest/SHA256SUMS.txt" "$base/SHA256SUMS.txt"
        awk -v a="$AEGIS_ASSET" '$2 == a' "$dest/SHA256SUMS.txt" > "$dest/expected.txt"
        test -s "$dest/expected.txt"
        (cd "$dest" && sha256sum -c expected.txt)
        chmod +x "$dest/$AEGIS_ASSET" || true
        echo "AEGIS_BIN=$dest/$AEGIS_ASSET" >> "$GITHUB_ENV"
        "$dest/$AEGIS_ASSET" version

    - name: Scan with Aegis
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        BASELINE: ${{ inputs.baseline }}
        EXTRA_ARGS: ${{ inputs.args }}
      run: |
        set -uo pipefail
        sarif="$RUNNER_TEMP/aegis-results.sarif"
        cmd=("$AEGIS_BIN" scan "$SCAN_PATH" --format=sarif)
        if [ "$FAIL_ON" != "none" ]; then
          cmd+=(--fail-on="$FAIL_ON")
        fi
        if [ -n "$BASELINE" ]; then
          cmd+=(--baseline="$BASELINE")
        fi
        if [ -n "$EXTRA_ARGS" ]; then
          # Intentional word splitting: EXTRA_ARGS is a documented
          # verbatim passthrough of extra CLI flags.
          # shellcheck disable=SC2206
          extra=($EXTRA_ARGS)
          cmd+=("${extra[@]}")
        fi
        echo "Running: ${cmd[*]}"
        # GitHub runs bash steps with -e: capture the scan's exit code
        # explicitly so a findings-bearing scan cannot kill the step
        # before outputs are written (report-only mode depends on it).
        scan_exit=0
        "${cmd[@]}" > "$sarif" || scan_exit=$?
        findings="$(jq '[.runs[].results[]] | length' "$sarif")"
        echo "sarif-file=$sarif" >> "$GITHUB_OUTPUT"
        echo "findings=$findings" >> "$GITHUB_OUTPUT"
        echo "Aegis: $findings finding(s) in $SCAN_PATH (gate: fail-on=$FAIL_ON, scan exit $scan_exit)"
        if [ "$FAIL_ON" != "none" ] && [ "$scan_exit" -ne 0 ]; then
          echo "::error::Aegis gate failed: findings at or above '$FAIL_ON' in $SCAN_PATH."
          exit "$scan_exit"
        fi
        exit 0

    - name: Upload SARIF to code scanning
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: aegis
