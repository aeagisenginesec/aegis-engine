name: parity-database-public
runtime: yaml
resources:
  db:
    type: gcp:sql:DatabaseInstance
    properties:
      name: parity-db
      databaseVersion: POSTGRES_15
      region: europe-west1
      settings:
        tier: db-f1-micro
        ipConfiguration:
          ipv4Enabled: true
          authorizedNetworks:
            - name: open-to-world
              value: 0.0.0.0/0
