AWSTemplateFormatVersion: 2010-09-09
Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: parity-logged-data
      LoggingConfiguration:
        DestinationBucketName: !Ref LogBucket
        LogFilePrefix: log/
  LogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: parity-log-target
