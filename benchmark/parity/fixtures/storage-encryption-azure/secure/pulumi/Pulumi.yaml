name: parity-storage-encryption
runtime: yaml
resources:
  st:
    type: azure-native:storage:StorageAccount
    properties:
      resourceGroupName: parity-rg
      accountName: parityencst
      kind: StorageV2
      sku:
        name: Standard_LRS
      encryption:
        requireInfrastructureEncryption: true
        keySource: Microsoft.Storage
