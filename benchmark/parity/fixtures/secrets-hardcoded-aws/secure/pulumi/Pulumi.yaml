name: parity-secrets
runtime: yaml
configuration:
  dbPassword:
    type: string
resources:
  parityDb:
    type: aws:rds:Instance
    properties:
      identifier: parity-db
      engine: postgres
      instanceClass: db.t3.micro
      allocatedStorage: 20
      username: admin
      password: ${dbPassword}
      publiclyAccessible: false
      skipFinalSnapshot: true
