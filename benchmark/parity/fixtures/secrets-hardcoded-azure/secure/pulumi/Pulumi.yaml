name: parity-secrets-hardcoded
runtime: yaml
configuration:
  dbPassword:
    type: string
resources:
  sql:
    type: azure-native:sql:Server
    properties:
      resourceGroupName: parity-rg
      serverName: parity-mssql
      location: westeurope
      administratorLogin: dbadmin
      publicNetworkAccess: Disabled
      administratorLoginPassword: ${dbPassword}
