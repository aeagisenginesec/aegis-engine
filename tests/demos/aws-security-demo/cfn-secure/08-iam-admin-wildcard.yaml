AWSTemplateFormatVersion: "2010-09-09"
Resources:
  DemoPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: demo-admin-wildcard
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - arn:aws:s3:::demo-bucket
              - arn:aws:s3:::demo-bucket/*
