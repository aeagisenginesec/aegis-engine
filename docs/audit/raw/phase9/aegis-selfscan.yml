# Aegis IaC scan — runs on every push and pull request.
# Fails the build when a high-or-worse finding is present, and uploads the
# SARIF report to GitHub code scanning.
name: aegis-scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build aegis
        run: go build -o aegis ./cmd/aegis

      - name: Scan with Aegis
        run: ./aegis scan . --format=sarif --fail-on=high > aegis.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: aegis.sarif
