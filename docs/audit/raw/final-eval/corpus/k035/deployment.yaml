apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-runner
  labels:
    app: ci-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ci-runner
  template:
    metadata:
      labels:
        app: ci-runner
    spec:
      containers:
        - name: runner
          image: example/ci-runner:5.0
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
