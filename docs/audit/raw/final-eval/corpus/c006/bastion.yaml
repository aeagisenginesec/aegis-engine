AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Bastion host for production access. Ingress is limited to the office range
  and the root volume is encrypted.

Parameters:
  OfficeCidr:
    Type: String
    Default: 203.0.113.0/24
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}\/\d{1,2}$'
  KeyPairName:
    Type: String

Mappings:
  RegionAmi:
    eu-west-1:
      Ami: ami-0c55b159cbfafe1f0
    us-east-1:
      Ami: ami-0a0e237f0b69c559c

Resources:
  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Bastion ingress, office only
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref OfficeCidr

  BastionHost:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !FindInMap [RegionAmi, !Ref 'AWS::Region', Ami]
      InstanceType: t3.small
      KeyName: !Ref KeyPairName
      SecurityGroupIds:
        - !Ref BastionSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            Encrypted: true
      MetadataOptions:
        HttpTokens: optional
        HttpEndpoint: enabled
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y fail2ban
          systemctl enable fail2ban
      Tags:
        - Key: Name
          Value: prod-bastion

Outputs:
  BastionId:
    Value: !Ref BastionHost
