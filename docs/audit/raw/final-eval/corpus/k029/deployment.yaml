apiVersion: apps/v1
kind: Deployment
metadata:
  name: profiler
  labels:
    app: profiler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profiler
  template:
    metadata:
      labels:
        app: profiler
    spec:
      containers:
        - name: profiler
          image: example/profiler:1.9.0
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
