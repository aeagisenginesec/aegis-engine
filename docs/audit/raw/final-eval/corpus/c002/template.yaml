AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Raw zone of the analytics data lake. Objects are SSE-KMS encrypted,
  versioned and private; unencrypted or non-TLS writes are explicitly denied.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Default: prod
  KmsKeyArn:
    Type: String
    Description: ARN of the CMK used for default bucket encryption.

Mappings:
  RetentionMap:
    dev:
      NoncurrentDays: 90
    prod:
      NoncurrentDays: 2555

Resources:
  RawZoneBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'acme-datalake-raw-${Environment}-${AWS::AccountId}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref KmsKeyArn
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: !FindInMap [RetentionMap, !Ref Environment, NoncurrentDays]
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogBucket
        LogFilePrefix: !Sub 'raw-zone/${Environment}/'

  AccessLogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'acme-datalake-logs-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref KmsKeyArn
            BucketKeyEnabled: true

  RawZoneBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RawZoneBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyUnencryptedPuts
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${RawZoneBucket.Arn}/*'
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt RawZoneBucket.Arn
              - !Sub '${RawZoneBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  RawZoneBucketName:
    Value: !Ref RawZoneBucket
