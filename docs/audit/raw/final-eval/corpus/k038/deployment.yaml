apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch
  labels:
    app: batch
spec:
  replicas: 4
  selector:
    matchLabels:
      app: batch
  template:
    metadata:
      labels:
        app: batch
    spec:
      containers:
        - name: batch
          image: example/batch:latest
          imagePullPolicy: Always
