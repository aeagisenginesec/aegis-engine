services:
  api:
    image: example/api:2.4.0
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: 0.5
    secrets:
      - api_token
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

secrets:
  api_token:
    file: ./secrets/api_token.txt

networks:
  backend:
    internal: true
