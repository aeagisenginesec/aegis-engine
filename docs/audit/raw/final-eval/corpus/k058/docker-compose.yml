services:
  api:
    build: .
    image: example/api:2.4.0
    user: "10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    secrets:
      - db_password
    depends_on:
      - db

  db:
    image: postgres:16.3-alpine
    secrets:
      - db_password
    volumes:
      - dbdata:/var/lib/postgresql/data

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  dbdata:
