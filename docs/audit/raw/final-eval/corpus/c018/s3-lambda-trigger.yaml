AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Image pipeline: uploads to the intake bucket trigger the resizer Lambda.
  The function URL was left open for the mobile team to test against.

Parameters:
  Environment:
    Type: String
    Default: prod
  KmsKeyArn:
    Type: String

Resources:
  IntakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'acme-image-intake-${Environment}-${AWS::AccountId}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref KmsKeyArn
            BucketKeyEnabled: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ResizerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .jpg

  ResizerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref 'AWS::AccountId'
      Policies:
        - PolicyName: resizer-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub '${IntakeBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/image-resizer*'

  ResizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: image-resizer
      Runtime: python3.12
      Handler: resize.handler
      Role: !GetAtt ResizerRole.Arn
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 200}
      KmsKeyArn: !Ref KmsKeyArn
      TracingConfig:
        Mode: Active
      Timeout: 90
      MemorySize: 1024

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ResizerFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !GetAtt IntakeBucket.Arn

  ResizerUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ResizerFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: ['*']

Outputs:
  FunctionUrl:
    Value: !GetAtt ResizerUrl.FunctionUrl
