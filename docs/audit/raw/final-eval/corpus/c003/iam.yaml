AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Shared deploy role used by the CI runners. Created quickly during the cloud
  migration; permissions were widened until the pipeline stopped failing.

Parameters:
  RoleName:
    Type: String
    Default: ci-deploy-role

Resources:
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      Policies:
        - PolicyName: extra-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: '*'
                Resource: '*'

  DeployInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${RoleName}-profile'
      Roles:
        - !Ref DeployRole

Outputs:
  RoleArn:
    Value: !GetAtt DeployRole.Arn
