services:
  api:
    build: .
    image: example/api:2.4.0
    user: "10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DB_PASSWORD: "db-P@ss-2024"
    depends_on:
      - db

  db:
    image: postgres:16.3-alpine
    user: "999"
    volumes:
      - dbdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: "db-P@ss-2024"

volumes:
  dbdata:
