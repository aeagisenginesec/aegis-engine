AWSTemplateFormatVersion: '2010-09-09'
Description: Webhook receiver Lambda written during the hackathon.

Parameters:
  S3Bucket:
    Type: String
    Description: Bucket holding the deployment package.
  S3Key:
    Type: String
    Default: webhook-receiver.zip

Resources:
  WebhookRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: allow-everything
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: '*'
                Resource: '*'

  WebhookFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: webhook-receiver
      Runtime: python3.12
      Handler: app.handler
      Role: !GetAtt WebhookRole.Arn
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Ref S3Key
      Environment:
        Variables:
          DB_PASSWORD: Sup3rSecret123!
          STRIPE_API_KEY: sk_live_51H7xYzAbCdEfGhIjKlMn
      Timeout: 60
      MemorySize: 512

Outputs:
  FunctionArn:
    Value: !GetAtt WebhookFunction.Arn
