apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor
  labels:
    app: monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor
  template:
    metadata:
      labels:
        app: monitor
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: monitor
          image: example/monitor:3.0
          ports:
            - containerPort: 9090
