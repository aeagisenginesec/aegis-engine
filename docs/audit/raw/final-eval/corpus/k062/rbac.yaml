apiVersion: v1
kind: ServiceAccount
metadata:
  name: reporter
  namespace: analytics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metrics-reader
  namespace: analytics
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reporter-metrics-reader
  namespace: analytics
subjects:
  - kind: ServiceAccount
    name: reporter
    namespace: analytics
roleRef:
  kind: Role
  name: metrics-reader
  apiGroup: rbac.authorization.k8s.io
