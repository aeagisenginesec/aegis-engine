AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Production Postgres for the orders service. Encrypted with a customer
  managed key, Multi-AZ, private subnets only, deletion protected.

Parameters:
  Environment:
    Type: String
    Default: prod
  KmsKeyArn:
    Type: String
  VpcId:
    Type: String
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  AppSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

Resources:
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for orders DB
      SubnetIds: !Ref PrivateSubnetIds

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Orders database, app tier only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroupId

  OrdersDb:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      EngineVersion: '15.4'
      DBInstanceClass: db.r6g.large
      AllocatedStorage: 200
      StorageType: gp3
      StorageEncrypted: true
      KmsKeyId: !Ref KmsKeyArn
      DBName: orders
      MasterUsername: orders_admin
      ManageMasterUserPassword: true
      MasterUserSecret:
        KmsKeyId: !Ref KmsKeyArn
      MultiAZ: true
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      BackupRetentionPeriod: 7
      DeleteAutomatedBackups: false
      DeletionProtection: true
      EnablePerformanceInsights: true
      PerformanceInsightsKMSKeyId: !Ref KmsKeyArn
      PerformanceInsightsRetentionPeriod: 731
      CopyTagsToSnapshot: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  DbEndpoint:
    Value: !GetAtt OrdersDb.Endpoint.Address
  DbSecretArn:
    Value: !GetAtt OrdersDb.MasterUserSecret.SecretArn
