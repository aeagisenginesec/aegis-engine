name: r3116-stack
runtime: yaml
description: Pulumi stack (toplevel layout)
resources:
    dataAccount:
      type: azure-native:storage:StorageAccount
      properties:
        accountName: data99da81
        resourceGroupName: rg-data
        location: westeurope
        kind: StorageV2
        sku:
          name: Standard_LRS
        allowBlobPublicAccess: false
        minimumTlsVersion: TLS1_2
        supportsHttpsTrafficOnly: true

    siteBucket:
      type: aws:s3:Bucket
      properties:
        bucket: site-99da81
        acl: private
