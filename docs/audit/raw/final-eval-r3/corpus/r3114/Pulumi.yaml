name: r3114-stack
runtime: yaml
description: Pulumi stack (toplevel layout)
resources:
    siteBucket:
      type: aws:s3:Bucket
      properties:
        bucket: site-876708
        acl: private

    dataAccount:
      type: azure-native:storage:StorageAccount
      properties:
        accountName: data876708
        resourceGroupName: rg-data
        location: westeurope
        kind: StorageV2
        sku:
          name: Standard_LRS
        allowBlobPublicAccess: false
        minimumTlsVersion: TLS1_2
        supportsHttpsTrafficOnly: true
