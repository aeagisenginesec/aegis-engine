name: r3106-stack
runtime: yaml
description: Pulumi stack (template layout)
template:
  resources:
    webNsg:
      type: azure-native:network:NetworkSecurityGroup
      properties:
        networkSecurityGroupName: web-a2abaf
        resourceGroupName: rg-web
        location: westeurope
        securityRules:
          - name: allow-ssh
            properties:
              priority: 100
              direction: Inbound
              access: Allow
              protocol: Tcp
              sourcePortRange: "*"
              destinationPortRange: "22"
              sourceAddressPrefix: "*"
              destinationAddressPrefix: "*"

    dataAccount:
      type: azure-native:storage:StorageAccount
      properties:
        accountName: dataa2abaf
        resourceGroupName: rg-data
        location: westeurope
        kind: StorageV2
        sku:
          name: Standard_LRS
        allowBlobPublicAccess: true
        minimumTlsVersion: TLS1_2
        supportsHttpsTrafficOnly: true
