apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-a53a6d
  labels:
    app: worker-a53a6d
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-a53a6d
  template:
    metadata:
      labels:
        app: worker-a53a6d
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: worker
          image: registry.example.com/worker:1.4.0
          resources:
            limits: {cpu: "500m", memory: 256Mi}
            requests: {cpu: "250m", memory: 128Mi}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-a53a6d
  labels:
    app: api-a53a6d
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-a53a6d
  template:
    metadata:
      labels:
        app: api-a53a6d
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: registry.example.com/api:3.2.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            limits: {cpu: "500m", memory: 256Mi}
            requests: {cpu: "250m", memory: 128Mi}
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
