apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-733424
  labels:
    app: api-733424
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-733424
  template:
    metadata:
      labels:
        app: api-733424
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: registry.example.com/api:3.2.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            limits: {cpu: "500m", memory: 256Mi}
            requests: {cpu: "250m", memory: 128Mi}
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 8080}

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: monitor-733424
  labels:
    app: monitor-733424
spec:
  selector:
    matchLabels:
      app: monitor-733424
  template:
    metadata:
      labels:
        app: monitor-733424
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: monitor
          image: registry.example.com/monitor:1.9.0
          volumeMounts:
            - name: hostroot
              mountPath: /host
      volumes:
        - name: hostroot
          hostPath:
            path: /
