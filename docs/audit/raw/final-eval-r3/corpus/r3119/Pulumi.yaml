name: r3119-stack
runtime: yaml
description: Pulumi stack (toplevel layout)
resources:
    bastionSg:
      type: aws:ec2:SecurityGroup
      properties:
        name: bastion-30c0c5
        description: bastion access
        ingress:
          - protocol: tcp
            fromPort: 22
            toPort: 22
            cidrBlocks: ["203.0.113.26/32"]
        egress:
          - protocol: "-1"
            fromPort: 0
            toPort: 0
            cidrBlocks: ["0.0.0.0/0"]

    dataAccount:
      type: azure-native:storage:StorageAccount
      properties:
        accountName: data30c0c5
        resourceGroupName: rg-data
        location: westeurope
        kind: StorageV2
        sku:
          name: Standard_LRS
        allowBlobPublicAccess: false
        minimumTlsVersion: TLS1_2
        supportsHttpsTrafficOnly: true

    webNsg:
      type: azure-native:network:NetworkSecurityGroup
      properties:
        networkSecurityGroupName: web-30c0c5
        resourceGroupName: rg-web
        location: westeurope
        securityRules:
          - name: allow-ssh
            properties:
              priority: 100
              direction: Inbound
              access: Allow
              protocol: Tcp
              sourcePortRange: "*"
              destinationPortRange: "22"
              sourceAddressPrefix: "*"
              destinationAddressPrefix: "*"
