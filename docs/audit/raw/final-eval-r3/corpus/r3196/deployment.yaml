apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-fcbc65
  labels:
    app: api-fcbc65
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-fcbc65
  template:
    metadata:
      labels:
        app: api-fcbc65
    spec:
      containers:
        - name: api
          image: registry.example.com/api:3.2.0
          securityContext:
            privileged: true
            capabilities:
              add: [SYS_ADMIN, NET_ADMIN]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-fcbc65
  labels:
    app: api-fcbc65
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-fcbc65
  template:
    metadata:
      labels:
        app: api-fcbc65
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: registry.example.com/api:3.2.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            limits: {cpu: "500m", memory: 256Mi}
            requests: {cpu: "250m", memory: 128Mi}
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
