AWSTemplateFormatVersion: "2010-09-09"
Description: Public website bucket
Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: site-9f395a
      AccessControl: PublicRead
      WebsiteConfiguration:
        IndexDocument: index.html

  BastionSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: bastion-9f395a
      GroupDescription: bastion access
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
