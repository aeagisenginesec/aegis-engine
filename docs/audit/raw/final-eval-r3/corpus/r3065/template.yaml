AWSTemplateFormatVersion: "2010-09-09"
Description: Public website bucket
Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: site-74c3d1
      AccessControl: PublicRead
      WebsiteConfiguration:
        IndexDocument: index.html

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: data-74c3d1
  DataPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: arn:aws:s3:::data-74c3d1/*
