AWSTemplateFormatVersion: "2010-09-09"
Description: Bucket with open policy
Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: data-9edc5c
  DataPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: arn:aws:s3:::data-9edc5c/*

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0c55b159cbfafe1f0
      InstanceType: t3.micro
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      Tags: [{Key: Name, Value: web-9edc5c}]

  LogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: logs-9edc5c
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
