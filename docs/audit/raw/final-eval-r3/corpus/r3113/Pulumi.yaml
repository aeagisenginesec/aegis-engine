name: r3113-stack
runtime: yaml
description: Pulumi stack (toplevel layout)
resources:
    siteBucket:
      type: aws:s3:Bucket
      properties:
        bucket: site-2eb55a
        acl: public-read

    dataAccount:
      type: azure-native:storage:StorageAccount
      properties:
        accountName: data2eb55a
        resourceGroupName: rg-data
        location: westeurope
        kind: StorageV2
        sku:
          name: Standard_LRS
        allowBlobPublicAccess: false
        minimumTlsVersion: TLS1_2
        supportsHttpsTrafficOnly: true
