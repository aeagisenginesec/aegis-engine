AWSTemplateFormatVersion: "2010-09-09"
Description: Bucket with open policy
Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: data-6c78e3
  DataPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: arn:aws:s3:::data-6c78e3/*

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0c55b159cbfafe1f0
      InstanceType: t3.micro
      Tags: [{Key: Name, Value: web-6c78e3}]
