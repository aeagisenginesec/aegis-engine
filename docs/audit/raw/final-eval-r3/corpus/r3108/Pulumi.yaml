name: r3108-stack
runtime: yaml
description: Pulumi stack (template layout)
template:
  resources:
    siteBucket:
      type: aws:s3:Bucket
      properties:
        bucket: site-2148a3
        acl: public-read

    dataAccount:
      type: azure-native:storage:StorageAccount
      properties:
        accountName: data2148a3
        resourceGroupName: rg-data
        location: westeurope
        kind: StorageV2
        sku:
          name: Standard_LRS
        allowBlobPublicAccess: true
        minimumTlsVersion: TLS1_2
        supportsHttpsTrafficOnly: true
