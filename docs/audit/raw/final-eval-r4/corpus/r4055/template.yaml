AWSTemplateFormatVersion: "2010-09-09"
Description: App database
Resources:
  AppDB:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      EngineVersion: "15.4"
      DBInstanceClass: db.t3.micro
      DBInstanceIdentifier: app-012a49
      AllocatedStorage: "20"
      StorageEncrypted: true
      PubliclyAccessible: true
      MasterUsername: appadmin
      MasterUserPassword: Str0ng-012a49-Db!
      BackupRetentionPeriod: 7

  OpsUser:
    Type: AWS::IAM::User
    Properties:
      UserName: ops-012a49
  OpsAdmin:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: ops-admin
      Users: [!Ref OpsUser]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "*"
            Resource: "*"
