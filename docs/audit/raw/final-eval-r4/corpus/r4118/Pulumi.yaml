name: r4118-stack
runtime: yaml
description: Pulumi stack (toplevel layout)
resources:
    dataAccount:
      type: azure-native:storage:StorageAccount
      properties:
        accountName: datac89dfa
        resourceGroupName: rg-data
        location: westeurope
        kind: StorageV2
        sku:
          name: Standard_LRS
        allowBlobPublicAccess: true
        minimumTlsVersion: TLS1_2
        supportsHttpsTrafficOnly: true

    dbServer:
      type: azure-native:sql:Server
      properties:
        serverName: sql-c89dfa
        resourceGroupName: rg-db
        location: westeurope
        administratorLogin: sqladmin
        version: "12.0"
