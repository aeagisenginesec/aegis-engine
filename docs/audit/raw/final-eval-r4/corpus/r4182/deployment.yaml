apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-d0bf8e
  labels:
    app: api-d0bf8e
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-d0bf8e
  template:
    metadata:
      labels:
        app: api-d0bf8e
    spec:
      containers:
        - name: api
          image: registry.example.com/api:3.2.0
          resources:
            limits: {cpu: "500m", memory: 256Mi}
          livenessProbe:
            httpGet: {path: /health, port: 8080}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-d0bf8e
  labels:
    app: web-d0bf8e
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-d0bf8e
  template:
    metadata:
      labels:
        app: web-d0bf8e
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: registry.example.com/web:2.1.0
          resources:
            limits: {cpu: "250m", memory: 128Mi}
          livenessProbe:
            httpGet: {path: /health, port: 8080}

---
apiVersion: v1
kind: Service
metadata:
  name: web-d0bf8e
spec:
  type: LoadBalancer
  selector:
    app: web-d0bf8e
  ports: [{port: 80, targetPort: 8080}]
