apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-e66986
  labels:
    app: api-e66986
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-e66986
  template:
    metadata:
      labels:
        app: api-e66986
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: registry.example.com/api:3.2.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            limits: {cpu: "500m", memory: 256Mi}
            requests: {cpu: "250m", memory: 128Mi}
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 8080}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-e66986
  labels:
    app: job-e66986
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-e66986
  template:
    metadata:
      labels:
        app: job-e66986
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
      containers:
        - name: job
          image: registry.example.com/job:1.0.0
