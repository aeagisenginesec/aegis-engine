apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-fd8555
  labels:
    app: api-fd8555
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-fd8555
  template:
    metadata:
      labels:
        app: api-fd8555
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: registry.example.com/api:3.2.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            limits: {cpu: "500m", memory: 256Mi}
            requests: {cpu: "250m", memory: 128Mi}
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 8080}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-fd8555
  labels:
    app: web-fd8555
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-fd8555
  template:
    metadata:
      labels:
        app: web-fd8555
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: registry.example.com/web:2.1.0

---
apiVersion: v1
kind: Service
metadata:
  name: web-fd8555
spec:
  type: NodePort
  selector:
    app: web-fd8555
  ports: [{port: 80, targetPort: 8080, nodePort: 30080}]
