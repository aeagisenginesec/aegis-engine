AWSTemplateFormatVersion: "2010-09-09"
Description: SG via intrinsics
Resources:
  BastionSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: bastion access
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Sub "0.0.0.0/0"
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: !Ref WorldCidr
Parameters:
  WorldCidr:
    Type: String
    Default: 0.0.0.0/0
