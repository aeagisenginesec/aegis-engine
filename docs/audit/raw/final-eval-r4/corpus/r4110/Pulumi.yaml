name: r4110-stack
runtime: yaml
description: Pulumi stack (template layout)
template:
  resources:
    siteBucket:
      type: aws:s3:Bucket
      properties:
        bucket: site-e5c3a2
        acl: private

    dataAccount:
      type: azure-native:storage:StorageAccount
      properties:
        accountName: datae5c3a2
        resourceGroupName: rg-data
        location: westeurope
        kind: StorageV2
        sku:
          name: Standard_LRS
        allowBlobPublicAccess: false
        minimumTlsVersion: TLS1_2
        supportsHttpsTrafficOnly: true

    bastionSg:
      type: aws:ec2:SecurityGroup
      properties:
        name: bastion-e5c3a2
        description: bastion access
        ingress:
          - protocol: tcp
            fromPort: 22
            toPort: 22
            cidrBlocks: ["0.0.0.0/0"]
        egress:
          - protocol: "-1"
            fromPort: 0
            toPort: 0
            cidrBlocks: ["0.0.0.0/0"]
