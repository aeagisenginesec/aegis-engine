# R4 project r4174
services:
  api:
    image: registry.example.com/api:3.2.0
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 256M}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
  db:
    image: postgres:15.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
  worker:
    image: registry.example.com/worker:2.0.0
    user: "10001:10001"
