apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-002e1b
  labels:
    app: api-002e1b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-002e1b
  template:
    metadata:
      labels:
        app: api-002e1b
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: registry.example.com/api:3.2.0
          volumeMounts:
            - {name: hostroot, mountPath: /host}
      volumes:
        - name: hostroot
          hostPath: {path: /, type: Directory}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-002e1b
  labels:
    app: api-002e1b
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-002e1b
  template:
    metadata:
      labels:
        app: api-002e1b
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: registry.example.com/api:3.2.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            limits: {cpu: "500m", memory: 256Mi}
            requests: {cpu: "250m", memory: 128Mi}
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
