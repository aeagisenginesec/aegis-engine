name: r4101-stack
runtime: yaml
description: Pulumi stack (template layout)
template:
  resources:
    mainVault:
      type: azure-native:keyvault:Vault
      properties:
        vaultName: kv-59d8b2
        resourceGroupName: rg-kv
        location: westeurope
        properties:
          sku:
            family: A
            name: standard
          tenantId: 00000000-0000-0000-0000-000000000000
          enablePurgeProtection: false
          enableSoftDelete: true
