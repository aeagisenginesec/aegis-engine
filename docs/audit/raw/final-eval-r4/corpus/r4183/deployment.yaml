apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-5fd95d
  labels:
    app: web-5fd95d
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-5fd95d
  template:
    metadata:
      labels:
        app: web-5fd95d
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: registry.example.com/web:2.1.0
          resources:
            limits: {cpu: "250m", memory: 128Mi}
          livenessProbe:
            httpGet: {path: /health, port: 8080}

---
apiVersion: v1
kind: Service
metadata:
  name: web-5fd95d
spec:
  type: LoadBalancer
  selector:
    app: web-5fd95d
  ports: [{port: 80, targetPort: 8080}]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-5fd95d
  labels:
    app: job-5fd95d
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-5fd95d
  template:
    metadata:
      labels:
        app: job-5fd95d
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
      containers:
        - name: job
          image: registry.example.com/job:1.0.0
