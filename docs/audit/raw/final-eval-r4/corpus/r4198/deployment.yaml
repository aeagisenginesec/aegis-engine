apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-80d82e
  labels:
    app: worker-80d82e
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-80d82e
  template:
    metadata:
      labels:
        app: worker-80d82e
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: worker
          image: registry.example.com/worker:1.4.0
          resources:
            limits: {cpu: "500m", memory: 256Mi}
            requests: {cpu: "250m", memory: 128Mi}
