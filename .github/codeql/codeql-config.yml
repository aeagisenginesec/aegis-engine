# CodeQL configuration — path exclusions.
#
# Same rationale as .semgrepignore, .snyk and the SonarCloud
# exclusions: benchmark corpora, adjudicated evaluation data, demo
# stacks and parser fixtures are deliberately vulnerable DATA that
# Aegis is tested against — not shipped code. Product Go code under
# cmd/ and internal/ stays fully analyzed (only testdata fixture
# directories inside it are excluded).
name: "Aegis CodeQL config"

paths-ignore:
  - "benchmark/**"
  - "docs/**"
  - "tests/**"
  - "demo/**"
  - "internal/regression/**"
  - "**/testdata/**"
