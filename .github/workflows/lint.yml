# Lint gate — golangci-lint with the repository's calibrated config
# (.golangci.yml): errcheck, govet, ineffassign, staticcheck, unused,
# with a short list of named, justified exclusions. Zero findings is
# the bar; the config documents every exception.

name: Lint

on:
  push:
    branches: [main, master, mission/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
