# Publish the Aegis container image to GHCR whenever a GitHub Release is
# published or a version tag is pushed (the release workflow owns the
# binaries; this owns the image). Also runnable manually against any ref
# via workflow_dispatch.
#
# Why BOTH triggers: releases created by a workflow's GITHUB_TOKEN (ours
# are, via release.yml) do not emit events that trigger other workflows
# (GitHub's anti-recursion rule) — v2.1.1's release never fired the
# release:published trigger. Tag pushes are real events, so the push
# trigger below is the one that actually carries releases; the release
# trigger remains for releases published manually in the UI.
#
# Tags pushed: the release tag (e.g. v2.1.1), the bare version (2.1.1),
# and `latest`. Architectures: linux/amd64 + linux/arm64.

name: Docker

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build + push GHCR image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The tags this run actually published (semver tags on release
      # refs, just :latest on branch dispatches) — the Snyk scan job
      # consumes this so it always scans the image THIS run built,
      # whatever ref triggered it.
      image_tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=latest

      - name: Build + push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.release.published_at || github.event.head_commit.timestamp }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  snyk-image:
    name: Snyk container scan (report-only)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scan the image this run just published: the first tag from
      # the build job's metadata (a version tag on release refs,
      # :latest on branch dispatches).
      - name: Pull the image just published
        env:
          IMAGE_TAGS: ${{ needs.image.outputs.image_tags }}
        run: |
          IMAGE_REF="$(printf '%s\n' "$IMAGE_TAGS" | head -n1)"
          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"
          docker pull --platform linux/amd64 "$IMAGE_REF"

      - name: Install Snyk CLI
        run: |
          curl -sSfL --proto "=https" --tlsv1.2 -o "$RUNNER_TEMP/snyk" https://static.snyk.io/cli/v1.1307.4/snyk-linux
          chmod +x "$RUNNER_TEMP/snyk"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/snyk" --version

      # Report-only, same reasoning as the Snyk job in security.yml:
      # Snyk is the second opinion here; it must not gate releases.
      - name: Snyk container test (report-only)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk container test "$IMAGE_REF" --file=Dockerfile --json-file-output=snyk-container.json

      - name: Archive Snyk container report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snyk-container
          path: snyk-container.json
          retention-days: 30
          if-no-files-found: warn
