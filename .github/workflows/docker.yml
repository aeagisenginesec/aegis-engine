# Publish the Aegis container image to GHCR whenever a GitHub Release is
# published or a version tag is pushed (the release workflow owns the
# binaries; this owns the image). Also runnable manually against any ref
# via workflow_dispatch.
#
# Why BOTH triggers: releases created by a workflow's GITHUB_TOKEN (ours
# are, via release.yml) do not emit events that trigger other workflows
# (GitHub's anti-recursion rule) — v2.1.1's release never fired the
# release:published trigger. Tag pushes are real events, so the push
# trigger below is the one that actually carries releases; the release
# trigger remains for releases published manually in the UI.
#
# Tags pushed: the release tag (e.g. v2.1.1), the bare version (2.1.1),
# and `latest`. Architectures: linux/amd64 + linux/arm64.

name: Docker

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build + push GHCR image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=latest

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.release.published_at || github.event.head_commit.timestamp }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  snyk-image:
    name: Snyk container scan (report-only)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The ref name is the release tag on every real trigger (tag
      # push, release published, dispatch against a tag). Dispatching
      # this workflow from a BRANCH makes this pull fail — by design:
      # there is no branch-tagged image to scan.
      - name: Pull the amd64 image just published
        run: docker pull --platform linux/amd64 ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Install Snyk CLI
        run: |
          curl -sSfL -o "$RUNNER_TEMP/snyk" https://static.snyk.io/cli/v1.1307.4/snyk-linux
          chmod +x "$RUNNER_TEMP/snyk"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          snyk --version

      # Report-only, same reasoning as the Snyk job in security.yml:
      # Snyk is the second opinion here; it must not gate releases.
      - name: Snyk container test (report-only)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk container test ghcr.io/${{ github.repository }}:${{ github.ref_name }} --file=Dockerfile --json-file-output=snyk-container.json

      - name: Archive Snyk container report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-container
          path: snyk-container.json
          retention-days: 30
          if-no-files-found: warn
