name: Aegis IaC Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  aegis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Aegis
        run: |
          curl -sSL -o aegis \
            https://github.com/YOUR_ORG/aegis-engine/releases/latest/download/aegis-linux-amd64
          chmod +x aegis

      - name: Scan Terraform
        run: ./aegis scan . --format=sarif --fail-on=high > aegis.sarif || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: aegis.sarif
