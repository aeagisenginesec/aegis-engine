# Action Test — the consumer contract, exercised on real runners.
#
# This workflow uses the GitHub Action defined in this repository
# (action.yml) exactly as a consumer would, against three targets:
#
#   1. cmd/ — Go source, no IaC: the gate must PASS with 0 findings.
#   2. demo/ — the deliberately vulnerable demo stack, report-only:
#      the job must PASS and report > 0 findings.
#   3. demo/ with the gate on: the step must FAIL (findings at low+),
#      asserted by the job so the workflow stays green when the
#      Action behaves correctly.
#
# A fourth job proves the SARIF upload path against GitHub code
# scanning (category: aegis) on the repo's own demo stack.
#
# Two further suites widen the proof:
#
#   4. An OS/architecture matrix runs the report-only demo scan on
#      Linux x64, Linux ARM64, macOS ARM64, macOS x64 and Windows
#      x64 — every release binary's resolve/download/checksum path.
#   5. A consumer smoke job calls the PUBLISHED action
#      (aeagisenginesec/aegis-engine@v2) instead of ./ — the exact
#      line a real user's workflow contains.
#
# This is the dogfood for the Action. The repo's security self-gate
# (.github/workflows/aegis.yml) deliberately keeps building Aegis
# from the commit under test instead — a release gate must test the
# code in the tree, not the last release.

name: Action Test

on:
  workflow_dispatch:
  push:
    paths:
      - action.yml
      - .github/workflows/action-test.yml

permissions:
  contents: read

jobs:
  clean-tree-passes:
    name: Clean tree passes the gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan cmd/ (no IaC) with fail-on=low
        id: aegis
        uses: ./
        with:
          path: cmd
          fail-on: low
          upload-sarif: "false"
      - name: Assert zero findings
        shell: bash
        run: |
          echo "findings=${{ steps.aegis.outputs.findings }}"
          test "${{ steps.aegis.outputs.findings }}" = "0"

  demo-report-only:
    name: Demo stack, report-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan demo/ with fail-on=none
        id: aegis
        uses: ./
        with:
          path: demo
          fail-on: none
          upload-sarif: "false"
      - name: Assert findings were reported
        shell: bash
        run: |
          echo "findings=${{ steps.aegis.outputs.findings }}"
          test "${{ steps.aegis.outputs.findings }}" -gt 0

  demo-gate-fails:
    name: Demo stack trips the gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan demo/ with fail-on=low (expected to fail)
        id: aegis
        continue-on-error: true
        uses: ./
        with:
          path: demo
          fail-on: low
          upload-sarif: "false"
      - name: Assert the gate fired
        shell: bash
        run: |
          echo "action outcome=${{ steps.aegis.outcome }}"
          test "${{ steps.aegis.outcome }}" = "failure"

  demo-sarif-upload:
    name: Demo stack, SARIF upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan demo/ and upload SARIF to code scanning
        uses: ./
        with:
          path: demo
          fail-on: none
          upload-sarif: "true"

  os-matrix:
    name: Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-13
          - windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan demo/ report-only on ${{ matrix.os }}
        id: aegis
        uses: ./
        with:
          path: demo
          fail-on: none
          upload-sarif: "false"
      - name: Assert findings were reported
        shell: bash
        run: |
          echo "findings=${{ steps.aegis.outputs.findings }}"
          test "${{ steps.aegis.outputs.findings }}" -gt 0

  published-action-smoke:
    name: Published @v2, consumer smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan demo/ via the published Action (aeagisenginesec/aegis-engine@v2)
        id: aegis
        uses: aeagisenginesec/aegis-engine@v2
        with:
          path: demo
          fail-on: none
          upload-sarif: "false"
      - name: Assert findings were reported
        shell: bash
        run: |
          echo "findings=${{ steps.aegis.outputs.findings }}"
          test "${{ steps.aegis.outputs.findings }}" -gt 0
