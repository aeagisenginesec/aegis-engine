# Aegis release CI — build, vet, test, quality gate, determinism.
#
# NOTE: authored 2026-10-14, not yet run against GitHub (the repository does
# not exist yet). Review the first run's logs before trusting it as a gate.
#
# What it does on every push and pull request:
#   1. Builds Aegis from source with release ldflags (version stamp).
#   2. Runs `go vet`.
#   3. Runs the full test suite (`go test ./...`).
#   4. Runs `go test -race` on the race-sensitive packages.
#   5. Runs `aegis quality-gate` (precision/recall/coverage/perf/parser-safety).
#   6. Determinism check: scans the multi-cloud fixture 5 times and fails if
#      the JSON outputs are not byte-identical.
#
# The companion workflow `aegis.yml` runs Aegis against its own repository
# (self-scan security gate); this workflow validates the codebase itself.

name: Aegis Release CI

on:
  push:
    branches: [main, master, mission/**]
  pull_request:

env:
  GO_VERSION: "1.25"

jobs:
  build-test-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: |
          go build -trimpath \
            -ldflags "-s -w -X aegis/internal/version.BuildDate=$(date -u +%F) -X aegis/internal/version.Commit=${GITHUB_SHA::7}" \
            -o aegis ./cmd/aegis
          ./aegis --version
          ./aegis doctor

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::unformatted files:"; echo "$unformatted"
            exit 1
          fi

      - name: Full test suite
        run: go test ./...

      - name: Race tests (sensitive packages)
        run: go test -race ./internal/adapter/pulumi/ ./cmd/aegis/ ./internal/rules/ ./internal/rules/aws/ -count=1

      - name: Quality gate
        run: ./aegis quality-gate

      - name: Determinism check
        run: |
          # The multi-cloud fixture is a submodule-free local fixture used in
          # release validation; skip gracefully if absent (e.g. shallow forks).
          FIXTURE="${{ github.workspace }}/../multicloud-fixture"
          if [ ! -d "$FIXTURE" ]; then
            echo "fixture not present; determinism check skipped (not a failure)"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            ./aegis scan "$FIXTURE" --format=json > "/tmp/det-$i.json" || true
          done
          sha256sum /tmp/det-*.json | awk '{print $1}' | sort -u | wc -l | grep -qx 1 \
            || { echo "NON-DETERMINISTIC OUTPUT"; exit 1; }
          echo "determinism: 5/5 identical"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: aegis-linux-amd64
          path: aegis
