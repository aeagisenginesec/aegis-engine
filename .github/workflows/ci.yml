# Aegis release CI — build, vet, test, quality gate, determinism.
#
# Runs natively on every supported OS, not just cross-compiled from Linux:
# the matrix below matches the Action's own os-matrix (action-test.yml) —
# Linux x64, Linux ARM64, macOS ARM64, macOS Intel, Windows x64.
#
# What it does on every push and pull request, on each matrix leg:
#   1. Builds Aegis from source with release ldflags (version stamp).
#   2. Runs `go vet`.
#   3. Runs the full test suite (`go test ./...`).
#   4. Runs `go test -race` on the race-sensitive packages.
#   5. Runs `aegis quality-gate` (precision/recall/coverage/perf/parser-safety).
#   6. Determinism check: scans the multi-cloud fixture 5 times and fails if
#      the JSON outputs are not byte-identical (skips if the fixture is
#      absent, e.g. on hosted runners).
#   7. Uploads the native binary as a per-OS artifact.
#
# All `run:` steps use bash on every OS (Git Bash on Windows) so the same
# commands run unchanged on Linux, macOS and Windows. The only OS-specific
# piece is the binary name (`aegis` vs `aegis.exe`), set once in the
# "Set binary name" step and reused everywhere via $BIN.
#
# The companion workflow `aegis.yml` runs Aegis against its own repository
# (self-scan security gate); this workflow validates the codebase itself.

name: Aegis Release CI

on:
  push:
    branches: [main, master, mission/**]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.26"

jobs:
  build-test-gate:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set binary name
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "BIN=aegis.exe" >> "$GITHUB_ENV"
          else
            echo "BIN=aegis" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: |
          go build -trimpath \
            -ldflags "-s -w -X aegis/internal/version.BuildDate=$(date -u +%F) -X aegis/internal/version.Commit=${GITHUB_SHA::7}" \
            -o "$BIN" ./cmd/aegis
          ./$BIN --version
          ./$BIN doctor

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::unformatted files:"; echo "$unformatted"
            exit 1
          fi

      - name: Full test suite
        run: go test ./...

      - name: Race tests (sensitive packages)
        run: go test -race ./internal/adapter/pulumi/ ./cmd/aegis/ ./internal/rules/ ./internal/rules/aws/ -count=1

      - name: Quality gate
        run: ./$BIN quality-gate

      - name: Determinism check
        run: |
          # The multi-cloud fixture is a submodule-free local fixture used in
          # release validation; skip gracefully if absent (e.g. shallow forks).
          FIXTURE="${{ github.workspace }}/../multicloud-fixture"
          if [ ! -d "$FIXTURE" ]; then
            echo "fixture not present; determinism check skipped (not a failure)"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            ./$BIN scan "$FIXTURE" --format=json > "/tmp/det-$i.json" || true
          done
          sha256sum /tmp/det-*.json | awk '{print $1}' | sort -u | wc -l | grep -qx 1 \
            || { echo "NON-DETERMINISTIC OUTPUT"; exit 1; }
          echo "determinism: 5/5 identical"

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aegis-${{ matrix.os }}
          path: ${{ env.BIN }}
