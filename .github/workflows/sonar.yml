# Aegis code quality — SonarCloud (the hosted SonarQube), wired to this
# repo's CI. History: an ephemeral in-CI SonarQube was built first
# (option 3), then the owner made the repository public and ordered
# the Cloud route — public repos analyse free on SonarCloud, with a
# persistent dashboard: https://sonarcloud.io/project/overview?id=aeagisenginesec_aegis-engine
#
# Requires (already provisioned in repo secrets): SONAR_TOKEN and
# SONAR_HOST_URL=https://sonarcloud.io. NOTE: SonarCloud Automatic
# Analysis must stay OFF for this project (Administration → Analysis
# Method → "With GitHub Actions") — the scanner refuses to run while
# AutoScan is enabled.
#
# Token lifetime: the current SONAR_TOKEN was minted with SonarCloud's
# 30-day default expiry — it lapses 2026-11-20 and must be regenerated
# (SonarCloud → My Account → Access Tokens) and the secret updated.
#
# Scope: the same exclusions as every other gate in this repo. This
# repository's PURPOSE includes containing deliberately vulnerable
# fixtures (benchmark/), adjudicated evaluation corpora
# (docs/audit/raw/), scanner testdata, demo stacks (tests/demos/)
# and adapter input fixtures (tests/fixtures/), plus the README
# demo stack (demo/ — four deliberate misconfigurations the docs
# tell you to scan). Sonar's AutoScan,
# which ignores these exclusions, reported 986 "vulnerabilities",
# every one of them in fixture data; product code (internal/, cmd/)
# had zero issues. The exclusions below are what make the number
# mean something.
#
# The quality gate is a real gate: sonar.qualitygate.wait makes the
# scanner block until SonarCloud computes the gate and fail this job
# if it is ERROR.

name: SonarCloud

on:
  push:
    branches: [main, master, mission/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud scan + quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: Sonar uses SCM blame for new-code detection.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: SonarCloud scan (waits for the quality gate)
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.organization=aeagisenginesec
            -Dsonar.projectKey=aeagisenginesec_aegis-engine
            -Dsonar.exclusions=benchmark/**,docs/audit/raw/**,**/testdata/**,tests/demos/**,tests/fixtures/**,demo/**
            -Dsonar.qualitygate.wait=true
