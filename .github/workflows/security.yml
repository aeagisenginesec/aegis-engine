# Aegis security scanning — CodeQL static analysis of the engine's own Go
# code, plus govulncheck over the module graph (reachable-vulnerability
# gate: this job is what caught the Go 1.25 stdlib findings that forced
# the 1.26 toolchain upgrade in v2.1.1).
#
# Private-repo note: GitHub's code-scanning API (where CodeQL results
# normally land) requires GitHub Advanced Security on private repos —
# uploads fail with "Resource not accessible by integration". CodeQL
# therefore runs with upload: never and its SARIF is archived as a run
# artifact instead. If the repo goes public or GHAS is enabled, drop
# `upload: never` (and the artifact step) to restore Security-tab
# integration. govulncheck is unaffected: it is a hard gate either way.

name: Security

on:
  push:
    branches: [main, master, mission/**]
  pull_request:
  schedule:
    # Weekly re-scan: new advisories against unchanged code still surface.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"
          upload: never
          output: codeql-results

      - name: Archive CodeQL SARIF
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results/**/*.sarif
          retention-days: 30
          if-no-files-found: warn

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # NOT go-version-file: go.mod's bare "go 1.26.0" would pin the
          # .0 release, which predates the go1.26.1+ stdlib security
          # fixes (run #1 failed with 23 reachable stdlib vulns that a
          # patched toolchain does not have). Always take the newest
          # 1.26 patch release.
          go-version: "1.26.x"
          cache: true

      - name: Run govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
