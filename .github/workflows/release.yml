# Aegis release CD — multi-platform binaries + GitHub Release.
#
# Trigger: push a tag like v2.0.1. The tag MUST match the version const in
# internal/version (v<Version>); the job fails otherwise so a release can
# never ship a binary that reports the wrong version.
#
# What it does:
#   1. Verifies tag == v<version.Version> (reads the const via `go run`).
#   2. Cross-compiles ./cmd/aegis for linux/darwin/windows (amd64+arm64,
#      windows amd64 only) with BuildDate + Commit stamped in.
#   3. Runs the full test suite once on the release commit (cheap insurance;
#      the CI workflow already gates every push).
#   4. Writes SHA256SUMS.txt and publishes a GitHub Release with all
#      binaries attached.

name: Release

on:
  push:
    # Semver release tags only (v2.2.0). The moving "v2" tag belongs to
    # the GitHub Action and must never trigger a release build.
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  GO_VERSION: "1.26"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify tag matches version const
        run: |
          CODE_VER=$(grep -oP 'const Version = "\K[^"]+' internal/version/version.go)
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "code version: $CODE_VER | tag version: $TAG_VER"
          if [ "$CODE_VER" != "$TAG_VER" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version const $CODE_VER — bump internal/version first"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build all platforms
        run: |
          DATE="$(date -u +%F)"
          COMMIT="${GITHUB_SHA::7}"
          LDFLAGS="-s -w -X aegis/internal/version.BuildDate=$DATE -X aegis/internal/version.Commit=$COMMIT"
          mkdir -p dist
          build() { # $1=goos $2=goarch $3=suffix
            GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "$LDFLAGS" \
              -o "dist/aegis-$1-$2$3" ./cmd/aegis
          }
          build linux amd64 ""
          build linux arm64 ""
          build darwin amd64 ""
          build darwin arm64 ""
          build windows amd64 ".exe"
          ls -la dist/

      - name: Checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Aegis $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
